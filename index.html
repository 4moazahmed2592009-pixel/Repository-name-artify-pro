<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Artify PRO — Google Drive OAuth Bridge</title>
  <meta name="robots" content="noindex,nofollow">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body{margin:0;background:#0b1020;color:#e5e7eb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center}
    .card{width:min(560px,calc(100% - 32px));background:#111827;border:1px solid #273449;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0008}
    h1{font-size:20px;margin:0 0 10px}.muted{color:#9ca3af;font-size:13px;line-height:1.6}.status{margin-top:18px;padding:12px 14px;border-radius:12px;background:#0f172a;border:1px solid #24324a;font-size:13px}.ok{color:#86efac}.warn{color:#fcd34d}.err{color:#fca5a5}
  </style>
</head>
<body>
  <div class="card">
    <h1>Artify PRO — Google Drive Authorization</h1>
    <div class="muted">This page is a top-level OAuth bridge for Gemini Canvas. It does not upload project data and does not require a Client Secret.</div>
    <div id="status" class="status">Waiting for Artify…</div>
  </div>
<script>
(() => {
  'use strict';

  const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
  const ALLOWED_OPENER = /^https:\/\/(?:[^./]+\.)?scf\.usercontent\.goog$/i;
  const statusEl = document.getElementById('status');
  let openerWindow = null;
  let openerOrigin = null;
  let activeState = null;
  let tokenClient = null;
  let authStarted = false;
  let returnPort = null;

  const setStatus = (text, cls = '') => {
    statusEl.textContent = text;
    statusEl.className = 'status ' + cls;
  };

  const postToArtify = (payload) => {
    // Preferred path: dedicated MessagePort. This avoids relying on the opener
    // WindowProxy after cross-origin popup/browsing-context policy changes.
    if (returnPort) {
      try { returnPort.postMessage(payload); return true; } catch (e) {}
    }
    if (!openerWindow || !openerOrigin) return false;
    try {
      openerWindow.postMessage(payload, openerOrigin);
      return true;
    } catch (e) {
      return false;
    }
  };

  const fail = (state, error) => {
    const finalState = state || activeState || '';
    postToArtify({
      type: 'ARTIFY_DRIVE_AUTH_ERROR',
      state: finalState,
      error: String(error || 'DRIVE_AUTH_FAILED')
    });
    setStatus('Authorization failed. You can close this window.', 'err');
  };

  const waitForGoogleAndStart = (request) => {
    if (window.google?.accounts?.oauth2) {
      beginAuth(request);
      return;
    }
    setStatus('Loading Google authorization…', 'warn');
    setTimeout(() => waitForGoogleAndStart(request), 200);
  };

  const beginAuth = ({ clientId, scope, state }) => {
    if (authStarted) return;
    if (!state) return fail('', 'OAUTH_STATE_MISSING');
    if (scope !== DRIVE_SCOPE) return fail(state, 'INVALID_SCOPE');
    if (!clientId) return fail(state, 'DRIVE_CLIENT_MISSING');

    activeState = state;
    authStarted = true;

    try {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: DRIVE_SCOPE,
        callback: (response) => {
          if (!response) return fail(activeState, 'DRIVE_TOKEN_MISSING');
          if (response.error) {
            const error = String(response.error);
            if (error === 'interaction_required' || error === 'consent_required') {
              try {
                tokenClient.requestAccessToken({ prompt: 'consent' });
                return;
              } catch (retryError) {
                return fail(activeState, retryError);
              }
            }
            return fail(activeState, response.error_description || error);
          }
          if (!response.access_token) return fail(activeState, 'DRIVE_TOKEN_MISSING');

          const payload = {
            type: 'ARTIFY_DRIVE_TOKEN',
            state: activeState,
            access_token: String(response.access_token),
            expires_in: Number(response.expires_in || 3600)
          };

          const sent = postToArtify(payload);
          if (!sent) {
            setStatus('Authorization completed, but Artify could not be reached.', 'err');
            return;
          }

          setStatus('Authorization completed. This window will close automatically.', 'ok');
          setTimeout(() => { try { window.close(); } catch (e) {} }, 500);
        },
        error_callback: (err) => {
          const type = String(err?.type || 'unknown');
          fail(activeState, 'GIS_' + type);
        }
      });

      setStatus('Opening Google permission…', 'warn');
      tokenClient.requestAccessToken({ prompt: '' });
    } catch (error) {
      authStarted = false;
      fail(state, error);
    }
  };

  window.addEventListener('message', (event) => {
    if (!window.opener || event.source !== window.opener) return;
    if (!ALLOWED_OPENER.test(event.origin)) return;

    const data = event.data || {};
    if (data.type !== 'ARTIFY_DRIVE_AUTH_REQUEST') return;

    openerWindow = event.source;
    openerOrigin = event.origin;
    if (event.ports?.[0]) {
      try {
        returnPort = event.ports[0];
        returnPort.start();
      } catch (e) {}
    }

    waitForGoogleAndStart({
      clientId: String(data.clientId || ''),
      scope: String(data.scope || ''),
      state: String(data.state || '')
    });
  });

  if (!window.opener) {
    setStatus('Open this page from Artify PRO. It is an OAuth bridge, not a standalone sign-in page.', 'warn');
    return;
  }

  // Initial discovery handshake. The parent will reply with the authenticated
  // request and a MessagePort for the token response.
  try {
    window.opener.postMessage({ type: 'ARTIFY_DRIVE_BRIDGE_READY' }, '*');
    setStatus('Connected to Artify. Waiting for Google permission…', 'warn');
  } catch (error) {
    setStatus('Could not contact Artify.', 'err');
  }
})();
</script>

</body>
</html>
