<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Artify PRO — Google Drive OAuth Bridge</title>

  <meta name="robots" content="noindex,nofollow">

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body{
      margin:0;
      background:#0b1020;
      color:#e5e7eb;
      font-family:system-ui,-apple-system,Segoe UI,sans-serif;
      min-height:100vh;
      display:grid;
      place-items:center
    }

    .card{
      width:min(560px,calc(100% - 32px));
      background:#111827;
      border:1px solid #273449;
      border-radius:20px;
      padding:28px;
      box-shadow:0 20px 60px #0008
    }

    h1{
      font-size:20px;
      margin:0 0 10px
    }

    .muted{
      color:#9ca3af;
      font-size:13px;
      line-height:1.6
    }

    .status{
      margin-top:18px;
      padding:12px 14px;
      border-radius:12px;
      background:#0f172a;
      border:1px solid #24324a;
      font-size:13px
    }

    .ok{color:#86efac}
    .warn{color:#fcd34d}
    .err{color:#fca5a5}
  </style>
</head>

<body>

  <div class="card">
    <h1>Artify PRO — Google Drive Authorization</h1>

    <div class="muted">
      This page is a top-level OAuth bridge for Gemini Canvas.
      It does not upload project data and does not require a Client Secret.
    </div>

    <div id="status" class="status">
      Connecting to Artify…
    </div>
  </div>

<script>
(() => {
  'use strict';

  const DRIVE_SCOPE =
    'https://www.googleapis.com/auth/drive.file';

  /*
   * Gemini Canvas origin.
   *
   * Artify itself validates the bridge origin.
   * This bridge validates the opener before accepting OAuth requests.
   */
  const ALLOWED_OPENER =
    /^https:\/\/(?:[^./]+\.)?scf\.usercontent\.goog$/i;

  const statusEl =
    document.getElementById('status');

  let openerWindow = null;
  let openerOrigin = null;

  let activeState = null;
  let tokenClient = null;
  let authStarted = false;

  function setStatus(text, cls = '') {
    statusEl.textContent = text;
    statusEl.className = 'status ' + cls;
  }

  function postToArtify(payload) {
    if (!openerWindow || !openerOrigin) {
      return false;
    }

    try {
      openerWindow.postMessage(
        payload,
        openerOrigin
      );

      return true;
    } catch (error) {
      return false;
    }
  }

  function fail(state, error) {
    const finalState =
      state || activeState || '';

    postToArtify({
      type: 'ARTIFY_DRIVE_AUTH_ERROR',
      state: finalState,
      error: String(
        error || 'DRIVE_AUTH_FAILED'
      )
    });

    setStatus(
      'Authorization failed. You can close this window.',
      'err'
    );
  }

  function waitForGoogleAndStart(request) {

    if (
      window.google &&
      window.google.accounts &&
      window.google.accounts.oauth2
    ) {
      beginAuth(request);
      return;
    }

    setStatus(
      'Loading Google authorization…',
      'warn'
    );

    setTimeout(() => {
      waitForGoogleAndStart(request);
    }, 200);
  }

  function beginAuth({
    clientId,
    scope,
    state
  }) {

    if (authStarted) {
      return;
    }

    if (!state) {
      fail('', 'OAUTH_STATE_MISSING');
      return;
    }

    if (scope !== DRIVE_SCOPE) {
      fail(state, 'INVALID_SCOPE');
      return;
    }

    if (!clientId) {
      fail(state, 'DRIVE_CLIENT_MISSING');
      return;
    }

    activeState = state;
    authStarted = true;

    try {

      tokenClient =
        google.accounts.oauth2.initTokenClient({

          client_id: clientId,

          scope: DRIVE_SCOPE,

          callback: (response) => {

            if (!response) {
              fail(
                activeState,
                'DRIVE_TOKEN_MISSING'
              );
              return;
            }

            if (response.error) {

              const error =
                String(response.error);

              if (
                error === 'interaction_required' ||
                error === 'consent_required'
              ) {

                try {

                  tokenClient.requestAccessToken({
                    prompt: 'consent'
                  });

                  return;

                } catch (retryError) {

                  fail(
                    activeState,
                    retryError
                  );

                  return;
                }
              }

              fail(
                activeState,
                error
              );

              return;
            }

            if (!response.access_token) {

              fail(
                activeState,
                'DRIVE_TOKEN_MISSING'
              );

              return;
            }

            /*
             * Send the token back to Artify.
             */
            const sent =
              postToArtify({

                type: 'ARTIFY_DRIVE_TOKEN',

                state: activeState,

                access_token:
                  String(response.access_token),

                expires_in:
                  Number(
                    response.expires_in || 3600
                  )
              });

            if (!sent) {
              setStatus(
                'Authorization completed, but Artify could not be reached.',
                'err'
              );
              return;
            }

            setStatus(
              'Authorization completed. This window will close automatically.',
              'ok'
            );

            setTimeout(() => {
              try {
                window.close();
              } catch (e) {}
            }, 500);
          }
        });

      setStatus(
        'Opening Google permission…',
        'warn'
      );

      /*
       * Empty prompt lets Google decide whether
       * an existing grant can be reused.
       */
      tokenClient.requestAccessToken({
        prompt: ''
      });

    } catch (error) {

      authStarted = false;

      fail(
        state,
        error
      );
    }
  }

  /*
   * Receive OAuth request from Artify.
   */
  window.addEventListener(
    'message',
    (event) => {

      /*
       * Only accept messages from the window
       * that opened this bridge.
       */
      if (
        !window.opener ||
        event.source !== window.opener
      ) {
        return;
      }

      /*
       * Only accept the expected Gemini Canvas origin.
       */
      if (
        !ALLOWED_OPENER.test(event.origin)
      ) {
        return;
      }

      const data =
        event.data || {};

      if (
        data.type !==
        'ARTIFY_DRIVE_AUTH_REQUEST'
      ) {
        return;
      }

      openerWindow = event.source;
      openerOrigin = event.origin;

      waitForGoogleAndStart({

        clientId:
          String(data.clientId || ''),

        scope:
          String(data.scope || ''),

        state:
          String(data.state || '')
      });
    }
  );

  /*
   * The bridge must be opened by Artify.
   */
  if (!window.opener) {

    setStatus(
      'Open this page from Artify PRO. It is an OAuth bridge, not a standalone sign-in page.',
      'warn'
    );

    return;
  }

  /*
   * IMPORTANT:
   * Tell Artify that the popup is alive.
   *
   * Artify will validate:
   * - event.origin
   * - event.source
   *
   * before sending the OAuth request.
   */
  try {

    window.opener.postMessage(
      {
        type:
          'ARTIFY_DRIVE_BRIDGE_READY'
      },
      '*'
    );

    setStatus(
      'Connected to Artify. Waiting for Google permission…',
      'warn'
    );

  } catch (error) {

    setStatus(
      'Could not contact Artify.',
      'err'
    );
  }

})();
</script>

</body>
</html>
